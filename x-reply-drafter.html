<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>リプ下書き — Xキャプチャからリプライ/引用RPを生成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161C;
    --bg-card:#1D2029;
    --bg-card-raised:#232733;
    --border:#2C3040;
    --text:#EDEAE3;
    --text-muted:#9A9CA8;
    --reply:#4FB8A6;
    --reply-dim:#2C4B47;
    --quote:#E8A33D;
    --quote-dim:#4B3B22;
    --danger:#D9756B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  header{
    margin-bottom:22px;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    color:var(--text-muted);
    text-transform:uppercase;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:28px;
    margin:6px 0 8px;
    letter-spacing:.02em;
  }
  header p{
    font-size:13.5px;
    color:var(--text-muted);
    line-height:1.6;
    margin:0;
  }

  .card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
  }

  /* upload zone */
  .dropzone{
    border:1.5px dashed var(--border);
    border-radius:12px;
    padding:28px 16px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .dropzone.has-image{
    padding:0;
    border-style:solid;
    overflow:hidden;
  }
  .dropzone:active{ background:var(--bg-card-raised); }
  .dropzone .icon{
    font-size:26px;
    margin-bottom:8px;
    display:block;
  }
  .dropzone .label{
    font-size:14px;
    font-weight:700;
  }
  .dropzone .sub{
    font-size:12px;
    color:var(--text-muted);
    margin-top:4px;
  }
  #previewImg{
    display:block;
    width:100%;
    max-height:340px;
    object-fit:contain;
    background:#0D0F14;
  }
  .replace-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 4px 2px;
  }
  .replace-row button{
    background:none;
    border:none;
    color:var(--text-muted);
    font-size:12.5px;
    font-family:inherit;
    text-decoration:underline;
    padding:6px 2px;
  }
  input[type=file]{ display:none; }

  /* mode tabs */
  .tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:16px;
  }
  .tab{
    border:1.5px solid var(--border);
    background:var(--bg-card);
    color:var(--text-muted);
    border-radius:10px;
    padding:13px 8px;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    transition:all .15s ease;
  }
  .tab .tag{
    font-size:10.5px;
    font-weight:400;
    letter-spacing:.05em;
  }
  .tab.active[data-mode="reply"]{
    border-color:var(--reply);
    color:var(--reply);
    background:var(--reply-dim);
  }
  .tab.active[data-mode="quote"]{
    border-color:var(--quote);
    color:var(--quote);
    background:var(--quote-dim);
  }

  .generate-btn{
    width:100%;
    border:none;
    border-radius:10px;
    padding:15px;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    color:#101215;
    cursor:pointer;
    margin-bottom:18px;
    transition:opacity .15s ease, transform .1s ease;
  }
  .generate-btn:active{ transform:scale(.98); }
  .generate-btn[data-mode="reply"]{ background:var(--reply); }
  .generate-btn[data-mode="quote"]{ background:var(--quote); }
  .generate-btn:disabled{ opacity:.45; }

  /* result */
  .result-card{
    position:relative;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px 18px 18px;
    min-height:96px;
  }
  .stamp{
    position:absolute;
    top:14px;
    right:16px;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.08em;
    border:1.5px solid currentColor;
    border-radius:999px;
    padding:3px 9px;
    transform:rotate(6deg);
    opacity:.85;
  }
  .stamp.reply{ color:var(--reply); }
  .stamp.quote{ color:var(--quote); }

  .result-text{
    font-size:15.5px;
    line-height:1.75;
    white-space:pre-wrap;
    margin:6px 30px 14px 0;
    min-height:24px;
  }
  .result-text.placeholder{
    color:var(--text-muted);
    font-size:13.5px;
  }
  .result-actions{
    display:flex;
    gap:10px;
  }
  .result-actions button{
    flex:1;
    border-radius:8px;
    border:1.5px solid var(--border);
    background:var(--bg-card-raised);
    color:var(--text);
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    padding:10px;
    cursor:pointer;
  }
  .result-actions button:active{ background:var(--border); }
  .result-actions button.copied{
    border-color:var(--reply);
    color:var(--reply);
  }

  .status{
    font-size:12.5px;
    color:var(--text-muted);
    text-align:center;
    margin-top:10px;
    min-height:16px;
  }
  .status.error{ color:var(--danger); }

  .spinner{
    display:inline-block;
    width:13px; height:13px;
    border:2px solid var(--text-muted);
    border-top-color:var(--text);
    border-radius:50%;
    animation:spin .7s linear infinite;
    vertical-align:-2px;
    margin-right:6px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Screenshot → Draft</div>
    <h1>リプ下書き</h1>
    <p>Xの投稿キャプチャをアップロードすると、内容を読み取って返信・引用RPの文案を1つ作ります。</p>
  </header>

  <div class="card">
    <label class="dropzone" id="dropzone">
      <span class="icon">📎</span>
      <span class="label">投稿のスクショをアップロード</span>
      <span class="sub">タップして画像を選択（カメラロール可）</span>
      <input type="file" id="fileInput" accept="image/*">
    </label>
    <div class="replace-row" id="replaceRow" style="display:none;">
      <span style="font-size:12px;color:var(--text-muted);">画像を読み込みました</span>
      <button id="replaceBtn" type="button">別の画像に変える</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-mode="reply" id="tabReply">
      <span>リプライ</span>
      <span class="tag">返信として送る一言</span>
    </button>
    <button class="tab" data-mode="quote" id="tabQuote">
      <span>引用RP</span>
      <span class="tag">自分の投稿として添える一言</span>
    </button>
  </div>

  <button class="generate-btn" id="generateBtn" data-mode="reply" disabled>まず画像をアップロードしてください</button>

  <div class="result-card">
    <span class="stamp reply" id="stamp">AI下書き</span>
    <div class="result-text placeholder" id="resultText">生成すると、ここに提案文が表示されます。</div>
    <div class="result-actions">
      <button id="copyBtn" type="button" disabled>コピー</button>
      <button id="regenBtn" type="button" disabled>もう1案</button>
    </div>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const replaceRow = document.getElementById('replaceRow');
const replaceBtn = document.getElementById('replaceBtn');
const tabReply = document.getElementById('tabReply');
const tabQuote = document.getElementById('tabQuote');
const generateBtn = document.getElementById('generateBtn');
const resultText = document.getElementById('resultText');
const stamp = document.getElementById('stamp');
const copyBtn = document.getElementById('copyBtn');
const regenBtn = document.getElementById('regenBtn');
const statusEl = document.getElementById('status');

let imageBase64 = null;
let imageMediaType = null;
let mode = 'reply'; // 'reply' | 'quote'
let results = { reply: null, quote: null };

const MODE_LABEL = { reply: 'リプライ', quote: '引用RP' };

function setStatus(msg, isError){
  statusEl.textContent = msg || '';
  statusEl.classList.toggle('error', !!isError);
}

function setMode(next){
  mode = next;
  tabReply.classList.toggle('active', mode==='reply');
  tabQuote.classList.toggle('active', mode==='quote');
  generateBtn.dataset.mode = mode;
  generateBtn.className = 'generate-btn';
  generateBtn.dataset.mode = mode;
  stamp.className = 'stamp ' + mode;

  if(!imageBase64){
    generateBtn.textContent = 'まず画像をアップロードしてください';
    generateBtn.disabled = true;
  } else if(results[mode]){
    generateBtn.textContent = MODE_LABEL[mode] + '案をもう一度作る';
    generateBtn.disabled = false;
  } else {
    generateBtn.textContent = MODE_LABEL[mode] + '案を作る';
    generateBtn.disabled = false;
  }
  renderResult();
}

function renderResult(){
  const r = results[mode];
  if(r){
    resultText.textContent = r;
    resultText.classList.remove('placeholder');
    copyBtn.disabled = false;
    regenBtn.disabled = false;
  } else {
    resultText.textContent = '生成すると、ここに' + MODE_LABEL[mode] + 'の提案文が表示されます。';
    resultText.classList.add('placeholder');
    copyBtn.disabled = true;
    regenBtn.disabled = true;
  }
  copyBtn.classList.remove('copied');
  copyBtn.textContent = 'コピー';
}

dropzone.addEventListener('click', (e)=>{ /* label triggers input natively */ });

fileInput.addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  imageMediaType = file.type || 'image/jpeg';
  const reader = new FileReader();
  reader.onload = ()=>{
    imageBase64 = reader.result.split(',')[1];
    dropzone.classList.add('has-image');
    dropzone.innerHTML = '<img id="previewImg" src="'+reader.result+'" alt="preview">';
    replaceRow.style.display = 'flex';
    results = { reply:null, quote:null };
    setStatus('');
    setMode(mode);
  };
  reader.readAsDataURL(file);
});

replaceBtn.addEventListener('click', ()=>{
  fileInput.value = '';
  fileInput.click();
});

tabReply.addEventListener('click', ()=> setMode('reply'));
tabQuote.addEventListener('click', ()=> setMode('quote'));

async function generate(){
  if(!imageBase64) return;
  generateBtn.disabled = true;
  regenBtn.disabled = true;
  copyBtn.disabled = true;
  setStatus('');
  resultText.classList.add('placeholder');
  resultText.innerHTML = '<span class="spinner"></span>投稿内容を読み取っています…';

  const modeInstruction = mode === 'reply'
    ? '投稿者への「リプライ（返信）」として送る一言を1つ作成してください。相手の投稿に直接語りかける言葉づかいにしてください。'
    : '「引用リポスト」として自分のタイムラインに添える一言を1つ作成してください。投稿者への直接の呼びかけではなく、自分の視点からのひとことにしてください。';

  const systemPrompt = 'あなたはX（旧Twitter）の投稿画像を読み取り、返信文または引用リポスト文の下書きを1つだけ提案するアシスタントです。'
    + '画像に写っている投稿本文・文脈を正確に読み取り、その内容・雰囲気・言葉づかいに自然に合う文章を1案だけ作成してください。'
    + '投稿が日本語なら日本語で、英語なら英語で書いてください。'
    + '出力は提案文そのものだけにしてください。前置き、説明、見出し、引用符、ハッシュタグの乱用、絵文字の羅列は不要です。'
    + '長さは120文字前後を目安にしてください。'
    + modeInstruction;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 500,
        system: systemPrompt,
        messages: [
          {
            role: 'user',
            content: [
              { type:'image', source:{ type:'base64', media_type: imageMediaType, data: imageBase64 } },
              { type:'text', text: '画像内のX投稿を読み取り、指示に従って文案を1つだけ出力してください。' }
            ]
          }
        ]
      })
    });

    if(!response.ok){
      throw new Error('API error: ' + response.status);
    }
    const data = await response.json();
    const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
    const draft = textBlocks.join('\n').trim();
    if(!draft){
      throw new Error('empty response');
    }
    results[mode] = draft;
    setStatus('');
  } catch(err){
    console.error(err);
    setStatus('生成に失敗しました。画像を変えるか、もう一度試してください。', true);
  } finally {
    generateBtn.disabled = false;
    generateBtn.textContent = MODE_LABEL[mode] + '案をもう一度作る';
    renderResult();
  }
}

generateBtn.addEventListener('click', generate);
regenBtn.addEventListener('click', generate);

copyBtn.addEventListener('click', async ()=>{
  const r = results[mode];
  if(!r) return;
  try{
    await navigator.clipboard.writeText(r);
    copyBtn.classList.add('copied');
    copyBtn.textContent = 'コピーしました';
    setTimeout(()=>{ copyBtn.classList.remove('copied'); copyBtn.textContent='コピー'; }, 1600);
  }catch(e){
    setStatus('コピーに失敗しました。手動で選択してください。', true);
  }
});

setMode('reply');
</script>
</body>
</html>
