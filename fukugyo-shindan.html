    }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1,3),16);
      const g = parseInt(hex.slice(3,5),16);
      const b = parseInt(hex.slice(5,7),16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    function renderQuestion() {
      const q = questions[currentQuestion];
      const progress = ((currentQuestion + 1) / questions.length) * 100;
      document.getElementById('app').innerHTML = `
        <div class="container">
          <div class="header">
            <div class="header-icon">🎯</div>
            <h1>副業マッチング診断Pro</h1>
            <p>10の質問であなたに最適な副業を診断<br>詳細ロードマップPDF無料進呈</p>
          </div>
          <div class="progress-area">
            <div class="progress-labels">
              <span>質問 ${currentQuestion + 1} / ${questions.length}</span>
              <span>${Math.round(progress)}%</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width:${progress}%"></div>
            </div>
          </div>
          <div class="card">
            <div class="question-icon">${q.icon}</div>
            <h2 class="question-text">${q.question}</h2>
            <div class="options">
              ${q.options.map(opt => `
                <button class="option-btn" onclick="handleAnswer('${opt.value}')">
                  <span class="option-emoji">${opt.emoji}</span>
                  <span class="option-label">${opt.label}</span>
                  <span class="option-arrow">→</span>
                </button>
              `).join('')}
            </div>
          </div>
          <div class="footer">
            <p>副業診断作成：元店長サム</p>
            <p>在宅起業15年の経験を凝縮</p>
          </div>
        </div>
      `;
    }

    function renderResult(result) {
      const c = result.color;
      document.getElementById('app').innerHTML = `
        <div class="result-container">
          <div class="result-header" style="border: 4px solid ${c}">
            <div class="result-icon">${result.icon}</div>
            <div class="result-badge">Your Best Match</div>
            <h2 class="result-name" style="color:${c}">${result.name}</h2>
            <div class="result-desc-box">${result.description}</div>
          </div>

          <div class="grid-2">
            <div class="mini-card">
              <div class="mini-card-icon">💰</div>
              <div class="mini-card-label">収入目安</div>
              <div class="mini-card-value" style="color:${c}">${result.income}</div>
            </div>
            <div class="mini-card">
              <div class="mini-card-icon">🎯</div>
              <div class="mini-card-label">必要スキル</div>
              <div class="mini-card-value skills">${result.skills}</div>
            </div>
          </div>

          <div class="roadmap-card">
            <div class="roadmap-title">📅 3ヶ月ロードマップ（簡易版）</div>
            <div class="roadmap-steps">
              <div class="roadmap-step">
                <div class="step-badge" style="background:${hexToRgba(c,0.2)};color:${c}">1ヶ月</div>
                <div class="step-text">${result.roadmap.month1}</div>
              </div>
              <div class="roadmap-step">
                <div class="step-badge" style="background:${hexToRgba(c,0.3)};color:${c}">2ヶ月</div>
                <div class="step-text">${result.roadmap.month2}</div>
              </div>
              <div class="roadmap-step">
                <div class="step-badge" style="background:${c};color:white">3ヶ月</div>
                <div class="step-text">${result.roadmap.month3}</div>
              </div>
            </div>
            <div class="pdf-box">
              <div class="pdf-box-title">📄 無料PDF特典：「${result.pdf}」</div>
              <div class="pdf-box-content">
                詳細な3ヶ月ロードマップと実践ガイドをPDFでプレゼント！<br>
                下記ボタンからLINEに登録してパスワード「<strong>${result.password}</strong>」と送ってください。
              </div>
            </div>
          </div>

          <div class="cta-card">
            <div class="cta-title">🎁 無料PDFを受け取る</div>
            <div class="cta-desc">
              元店長サムの公式LINEに登録して<br>
              「${result.password}」と送信するだけ！<br>
              詳細ロードマップPDFを無料でお届けします。
            </div>
            <a href="https://lin.ee/xAf3xNl" class="cta-btn" target="_blank" rel="noopener">📲 LINEで無料PDFを受け取る</a>
            <div class="cta-note">登録無料・いつでも解除できます</div>
          </div>

          <button class="restart-btn" onclick="restart()">🔄 もう一度診断する</button>
          <div class="footer">
            <p>副業診断作成：元店長サム</p>
            <p>在宅起業15年の経験を凝縮</p>
          </div>
        </div>
      `;
    }

    function handleAnswer(value) {
      answers[questions[currentQuestion].id] = value;
      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        setTimeout(renderQuestion, 300);
      } else {
        const result = diagnose(answers);
        setTimeout(() => renderResult(result), 300);
      }
    }

    function restart() {
      currentQuestion = 0;
      answers = {};
      renderQuestion();
    }

    renderQuestion();
  </script>
</body>
</html>
